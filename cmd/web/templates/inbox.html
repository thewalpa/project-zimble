{{define "content"}}
{{$d := .Data}}
<h1>Inbox</h1>
<div class="panel">
{{if $d.Messages}}
<div class="actions" style="margin: 0 0 12px; font-size: 13px;">
  <span class="muted" style="align-self:center;">Sort:</span>
  {{sortHeader $d.Sort "when" "Date" "desc"}}
  <span class="muted">·</span>
  {{sortHeader $d.Sort "text" "Message" "asc"}}
</div>
<ul class="plain">{{range $d.Messages}}<li><span class="when">{{.When}}</span>{{.Text}}</li>{{end}}</ul>
{{else}}<p class="muted">No messages yet.</p>{{end}}
</div>
{{end}}
